---
__ntp_daemon: chronyd
ntp_tzdata_package: tzdata
__ntp_package: chrony
__ntp_config_file: /etc/chrony.conf
__ntp_driftfile: /var/lib/chrony/drift
ntp_cron_daemon: crond

# These can only be used on EL8 and later (chrony v?)
__ntp_keyfile: '/etc/chrony.keys'
__ntp_ntsdumpdir: '/var/lib/chrony'
__ntp_leapsectz: 'right/UTC'

#leapsecmode slew
